<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#f3f5ef">
        <meta name="description" content="Omada Wi-Fi session details and remaining access time.">
        <title>Wi-Fi Session Status</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main class="page-shell">
            <section class="session-panel" aria-labelledby="page-title">
                <header class="page-header">
                    <span class="brand-mark" aria-hidden="true">O</span>
                    <div class="brand-name">OMADA <span>GUEST WI-FI</span></div>
                    <p class="eyebrow">SESSION STATUS</p>
                    <h1 id="page-title">Your connection</h1>
                    <p class="intro">Access pass and session details</p>
                </header>

                <section class="time-panel" aria-label="Session time">
                    <div class="time-topline">
                        <div>
                            <span class="field-label">TIME USED</span>
                            <strong id="time-used">Not provided</strong>
                        </div>
                        <span class="duration-tag" id="session-duration">Duration unavailable</span>
                    </div>
                    <div class="progress-track" role="progressbar" aria-label="Session time used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                        <span id="progress-fill"></span>
                    </div>
                    <div class="time-bottomline">
                        <span class="field-label">TIME REMAINING</span>
                        <strong id="time-remaining">Not provided</strong>
                    </div>
                </section>

                <dl class="details-list">
                    <div class="detail-row">
                        <dt>Voucher code used</dt>
                        <dd id="voucher-code">Not provided</dd>
                    </div>
                    <div class="detail-row">
                        <dt>MAC address</dt>
                        <dd id="mac-address">Not provided</dd>
                    </div>
                    <div class="detail-row">
                        <dt>IP address</dt>
                        <dd id="ip-address">Not provided</dd>
                    </div>
                </dl>
            </section>
            <footer>Omada <span aria-hidden="true">·</span> Guest network</footer>
        </main>
        <script src="app.js"></script>
    </body>
</html>
